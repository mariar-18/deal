<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
       
        body { font-family: 'Inter', sans-serif; }

        .active-tab { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
        .inactive-tab { color: #9ca3af; }
       
        #toast { transform: translateX(150%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #toast.show { transform: translateX(0); }
       
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease; }
       
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .role-card:hover { transform: translateY(-5px); border-color: #4f46e5; }
        .price-tag { background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); }
       
        .custom-input {
            background-color: #ffffff;
            border: 1px solid #9ca3af; 
            border-radius: 16px;
            padding: 0.85rem;
            font-size: 0.875rem;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            color: #1f2937;
        }
        .custom-input::placeholder { color: #6b7280; }
        .custom-input:focus {
            background-color: white;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Status Badges */
        .badge { padding: 4px 12px; border-radius: 99px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-accepted { background: #dcfce7; color: #166534; }
        .badge-rejected { background: #fee2e2; color: #991b1b; }
        .badge-countered { background: #e0e7ff; color: #3730a3; }
        .badge-paid { background: #f3e8ff; color: #6b21a8; }

        .sold-tag {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="toast" class="fixed top-24 right-5 bg-indigo-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-[100] font-bold text-sm">
        <span id="toast-msg"></span>
    </div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full shadow-2xl text-center">
            <h3 id="confirm-msg" class="text-lg font-bold mb-6 text-gray-800">Are you sure?</h3>
            <div class="flex gap-4">
                <button id="confirm-yes" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">Yes</button>
                <button id="confirm-no" class="flex-1 bg-gray-100 text-gray-800 py-3 rounded-xl font-bold">No</button>
            </div>
        </div>
    </div>

    <nav class="bg-indigo-900 p-4 text-white flex justify-between items-center sticky top-0 z-50 shadow-md">
        <h1 class="text-2xl font-black cursor-pointer tracking-tighter" onclick="location.reload()">DEAL</h1>
        <div id="user-info" class="flex gap-4 items-center"></div>
    </nav>

    <div id="auth-box" class="max-w-4xl mx-auto mt-20 px-4 hidden">
        <div id="role-selection" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div onclick="selectRole('seller')" class="role-card bg-white p-12 rounded-[48px] shadow-xl border-4 border-transparent cursor-pointer transition-all text-center">
                <div class="text-5xl mb-4">💰</div>
                <h2 class="text-3xl font-black text-gray-800 mb-2">Seller</h2>
                <span class="bg-indigo-600 text-white px-10 py-3 rounded-full font-bold inline-block">Login</span>
            </div>
            <div onclick="selectRole('buyer')" class="role-card bg-white p-12 rounded-[48px] shadow-xl border-4 border-transparent cursor-pointer transition-all text-center">
                <div class="text-5xl mb-4">🛍️</div>
                <h2 class="text-3xl font-black text-gray-800 mb-2">Buyer</h2>
                <span class="bg-indigo-600 text-white px-10 py-3 rounded-full font-bold inline-block">Login</span>
            </div>
        </div>
       
        <div id="auth-form" class="max-w-md mx-auto p-10 bg-white rounded-[40px] shadow-2xl hidden">
            <button onclick="resetAuth()" class="text-indigo-600 font-bold mb-6 text-sm flex items-center gap-2">← Back to Roles</button>
            <h2 id="auth-title" class="text-3xl font-black mb-8 text-center text-gray-800">Login</h2>
            <div id="signup-fields" class="hidden">
                <input id="reg-name" placeholder="Full Name" class="custom-input mb-4">
                <select id="reg-campus" class="custom-input mb-4">
                    <option value="LBS Institue of Technology for Women">LBS Institue of Technology for Women</option>
                    <option value="College of Engineering Trivandrum">College of Engineering Trivandrum</option>
                    <option value="SCT College of Engineering">SCT College of Engineering</option>
                </select>
            </div>
            <input id="auth-email" placeholder="Campus Email" class="custom-input mb-4">
            <input id="auth-pass" type="password" placeholder="Password" class="custom-input mb-8">
            <button onclick="handleAuth()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all">Continue</button>
            <p onclick="toggleAuth()" class="text-center text-xs mt-6 text-indigo-500 cursor-pointer font-bold uppercase tracking-widest">Signup / Login</p>
        </div>
    </div>

    <div id="app-box" class="p-6 max-w-7xl mx-auto hidden">
        <div id="nav-tabs" class="flex gap-10 mb-10 border-b pb-2 overflow-x-auto no-scrollbar"></div>

        <div id="view-market" class="view-section active">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <h2 class="text-4xl font-black text-gray-800">Marketplace</h2>
                <div class="flex flex-1 w-full md:max-w-2xl gap-3">
                    <input type="text" id="market-search" oninput="loadMarketplace()" placeholder="Search items..." class="custom-input">
                    <select id="market-cat-filter" onchange="loadMarketplace()" class="custom-input max-w-[160px]">
                        <option value="all">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books</option>
                        <option value="Stationery">Stationery</option>
                        <option value="Other">Other</option>
                    </select>
                    <label class="flex items-center gap-2 bg-white px-5 rounded-2xl border border-gray-400 cursor-pointer h-[50px] whitespace-nowrap">
                        <input type="checkbox" id="show-all-campus" onchange="loadMarketplace()" class="w-4 h-4 accent-indigo-600">
                        <span class="text-[10px] font-black uppercase text-gray-600">All Campus</span>
                    </label>
                </div>
            </div>
            <div id="marketplace-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8"></div>
        </div>

        <div id="view-detail" class="view-section">
            <div class="max-w-5xl mx-auto">
                <button onclick="showView('market')" class="text-indigo-600 font-bold mb-6 flex items-center gap-2 hover:translate-x-[-4px] transition-transform">← Back to Marketplace</button>
                <div id="detail-content"></div>
            </div>
        </div>

        <div id="view-bargains" class="view-section">
            <h2 class="text-3xl font-black mb-2 text-gray-800">My Bargains</h2>
            <div id="buyer-offers-list" class="space-y-6 max-w-4xl mx-auto"></div>
        </div>

        <div id="view-orders" class="view-section">
            <h2 class="text-3xl font-black mb-2 text-gray-800">My Orders</h2>
            <div id="orders-list" class="space-y-6 max-w-3xl mx-auto"></div>
        </div>

        <div id="view-cart" class="view-section">
            <h2 class="text-3xl font-black mb-2 text-gray-800">My Cart</h2>
            <div id="cart-list" class="space-y-4 max-w-2xl mx-auto"></div>
        </div>

        <div id="view-seller" class="view-section">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <div class="bg-white p-8 rounded-[40px] border border-gray-100 shadow-xl h-fit">
                    <h3 class="font-black text-2xl mb-6 text-gray-800">List New Item</h3>
                    <input id="p-title" placeholder="Item Title" class="custom-input mb-4">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input id="p-price" type="number" placeholder="Price (₹)" class="custom-input font-bold">
                        <select id="p-condition" class="custom-input">
                    
                            <option value="Used">Used</option>
                            <option value="New">New</option>
                        </select>
                    </div>
                    <select id="p-category" class="custom-input mb-4">
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books</option>
                        <option value="Stationery">Stationery</option>
                        <option value="Other">Other</option>
                    </select>
                    <textarea id="p-desc" placeholder="Item Description" class="custom-input mb-6 h-32 no-scrollbar"></textarea>
                    <button onclick="postProduct()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all">List Now</button>
                </div>
                <div class="lg:col-span-2">
                    <h3 class="font-black text-2xl mb-6 text-gray-800">My Listed Items</h3>
                    <div id="my-products" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                </div>
            </div>
        </div>

        <div id="view-seller-offers" class="view-section">
            <h2 class="text-3xl font-black mb-2 text-gray-800">Offers Received</h2>
            <div id="seller-offers-list" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </div>

        <div id="view-wanted" class="view-section">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                <div id="buyer-req-box" class="bg-indigo-900 p-8 rounded-[40px] text-white shadow-2xl h-fit">
                    <h3 class="font-black text-2xl mb-2 text-center">Request Item</h3>
                    <input id="req-title" placeholder="What are you looking for?" class="w-full p-4 mb-4 rounded-2xl bg-white/10 outline-none border border-white/20 focus:bg-white/20 transition-all">
                    <textarea id="req-desc" placeholder="Add more details..." class="w-full p-4 mb-6 rounded-2xl bg-white/10 outline-none border border-white/20 h-24 no-scrollbar focus:bg-white/20 transition-all"></textarea>
                    <button onclick="submitRequest()" class="w-full bg-white text-indigo-900 py-4 rounded-2xl font-black hover:bg-gray-100 transition-all">Post Request</button>
                </div>
                <div id="requests-container" class="lg:col-span-2">
                    <h3 class="font-black text-2xl mb-6 text-gray-800">Wanted Board</h3>
                    <div id="requests-list" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="rating-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full shadow-2xl text-center">
            <h3 class="text-2xl font-black mb-2 text-gray-800">Rate Seller</h3>
            <div class="flex justify-center gap-3 mb-10 text-4xl text-gray-200">
                <button onclick="setRating(1)" class="star-btn hover:scale-110 transition-transform">★</button>
                <button onclick="setRating(2)" class="star-btn hover:scale-110 transition-transform">★</button>
                <button onclick="setRating(3)" class="star-btn hover:scale-110 transition-transform">★</button>
                <button onclick="setRating(4)" class="star-btn hover:scale-110 transition-transform">★</button>
                <button onclick="setRating(5)" class="star-btn hover:scale-110 transition-transform">★</button>
            </div>
            <button onclick="submitRating()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">Submit Feedback</button>
        </div>
    </div>

    <!-- Direct Buy Scheduling Modal -->
    <div id="buy-schedule-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[40px] max-w-md w-full shadow-2xl">
            <h3 class="text-2xl font-black mb-2 text-gray-800">Schedule Pickup</h3>
            <p class="text-xs font-bold text-gray-400 mb-6 uppercase tracking-widest text-center">Select 3 preferred meeting slots</p>
            
            <div id="buy-schedule-fields" class="space-y-4"></div>

            <div class="flex gap-4 mt-8">
                <button onclick="submitScheduledBuy()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">Confirm</button>
                <button onclick="document.getElementById('buy-schedule-modal').classList.add('hidden')" class="flex-1 bg-gray-100 text-gray-600 py-4 rounded-2xl font-black">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
